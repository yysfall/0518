<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paul & Jen ♡</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Ephesis&display=swap" rel="stylesheet">
</head>

<body>
  <main class="page">

    <nav>
      <div class="logo">Paul & Jen</div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="monthsary.html">Monthsary</a>
        <a href="letter.html">Letter</a>
      </div>
    </nav>


    <section class="hero">

      <div class="heart">♡</div>

      <h1>Paul & Jen</h1>

    </section>


    <section class="counters">

      <div class="card counter-card">

        <div class="counter-label">
          We've known each other for
        </div>

        <div
          class="number"
          id="knownDuration"
        >
          0 days
        </div>

        <div class="date-label">
          and counting
        </div>

      </div>


      <div class="card counter-card">

        <div class="counter-label">
          We've been together for
        </div>

        <div
          class="number"
          id="togetherDuration"
        >
          0 days
        </div>

        <div class="date-label">
          and counting
        </div>

      </div>

    </section>


    <section class="card countdown">

      <div class="countdown-top">

        <div>

          <div
            class="section-title"
            style="margin:0;"
          >
            Countdown
          </div>

          <div class="date-label">
            Choose something special to look forward to.
          </div>

        </div>


        <select id="countdownSelect"></select>

      </div>


      <div class="counter-card">

        <div
          class="countdown-number"
          id="countdownDays"
        >
          0
        </div>

        <div
          class="countdown-event"
          id="countdownEvent"
        ></div>

      </div>

    </section>


    <section class="card message-card">

      <div class="message-content">

        <div class="message-title">
          A LITTLE REMINDER FOR YOU
        </div>

        <p id="message"></p>

        <button onclick="newMessage()">
          💌
        </button>

      </div>

    </section>


    <footer>
      Made with ♡, just for you.
    </footer>

  </main>


  <script>

  /*
  ============================================
  PERSONALIZE THESE DATES
  ============================================
  Format: YYYY-MM-DD
  */

  const knownEachOtherDate = "2026-04-25";

  const relationshipStartDate = "2026-05-18";


  /*
  ============================================
  COUNTDOWN EVENTS
  ============================================

  DATE:
  YYYY-MM-DD

  TIME:
  24-hour format HH:MM

  Examples:

  19:00 = 7:00 PM
  20:30 = 8:30 PM
  00:00 = midnight

  ============================================
  */

  const countdownEvents = [

    {
      name: "Our Next Anniversary",
      date: "2027-05-18",
      time: "00:00"
    },

    {
      name: "Our Next Monthsary",
      date: "2026-09-18",
      time: "00:00"
    },

    {
      name: "BEBETIME",
      date: "2026-08-28",
      time: "06:00"
    }

  ];


  /*
  ============================================
  YOUR PERSONAL MESSAGES
  ============================================
  */

  const messages = [

    "I'm so grateful I met you.",

    "I love you always.",

    "I will always choose you and I will always choose to love you.",

    "You are my greatest blessing.",

    "You make everything better.",

    "I love you just the way you are.",

    "I am always proud of you.",

    "Loving you is the easiest thing to do.",

    "You deserve all the good things this world has to offer."

  ];


  /*
  ============================================
  DATE FUNCTIONS
  ============================================
  */

  function parseDate(dateString) {

    const [year, month, day] =
      dateString.split("-").map(Number);

    return new Date(
      year,
      month - 1,
      day
    );

  }


  /*
  ============================================
  PARSE DATE + TIME
  ============================================
  */

  function parseDateTime(
    dateString,
    timeString
  ) {

    const [year, month, day] =
      dateString
        .split("-")
        .map(Number);


    const [hours, minutes] =
      timeString
        .split(":")
        .map(Number);


    return new Date(
      year,
      month - 1,
      day,
      hours,
      minutes,
      0
    );

  }


  /*
  ============================================
  RELATIONSHIP DURATION
  ============================================
  */

  function calculateDuration(startDate) {

    const today = new Date();


    let years =
      today.getFullYear() -
      startDate.getFullYear();


    let months =
      today.getMonth() -
      startDate.getMonth();


    let days =
      today.getDate() -
      startDate.getDate();


    // Borrow days from previous month

    if (days < 0) {

      months--;

      const previousMonth =
        new Date(
          today.getFullYear(),
          today.getMonth(),
          0
        );

      days += previousMonth.getDate();

    }


    // Borrow a year

    if (months < 0) {

      years--;

      months += 12;

    }


    return {
      years,
      months,
      days
    };

  }


  function formatDuration(duration) {

    const parts = [];


    if (duration.years > 0) {

      parts.push(
        `${duration.years} ${
          duration.years === 1
            ? "year"
            : "years"
        }`
      );

    }


    if (duration.months > 0) {

      parts.push(
        `${duration.months} ${
          duration.months === 1
            ? "month"
            : "months"
        }`
      );

    }


    if (
      duration.days > 0 ||
      parts.length === 0
    ) {

      parts.push(
        `${duration.days} ${
          duration.days === 1
            ? "day"
            : "days"
        }`
      );

    }


    return parts.join(", ");

  }


  function updateRelationshipCounters() {

    const knownDuration =
      calculateDuration(
        parseDate(
          knownEachOtherDate
        )
      );


    const togetherDuration =
      calculateDuration(
        parseDate(
          relationshipStartDate
        )
      );


    document.getElementById(
      "knownDuration"
    ).textContent =
      formatDuration(
        knownDuration
      );


    document.getElementById(
      "togetherDuration"
    ).textContent =
      formatDuration(
        togetherDuration
      );

  }


  /*
  ============================================
  COUNTDOWN
  ============================================
  */

  function getTimeUntil(targetDate) {

    const now = new Date();


    const difference =
      targetDate.getTime() -
      now.getTime();


    if (difference <= 0) {

      return {
        total: difference,
        days: 0,
        hours: 0,
        minutes: 0
      };

    }


    const days =
      Math.floor(
        difference /
        (1000 * 60 * 60 * 24)
      );


    const hours =
      Math.floor(
        (
          difference %
          (1000 * 60 * 60 * 24)
        ) /
        (1000 * 60 * 60)
      );


    const minutes =
      Math.floor(
        (
          difference %
          (1000 * 60 * 60)
        ) /
        (1000 * 60)
      );


    return {
      total: difference,
      days,
      hours,
      minutes
    };

  }


  function setupCountdowns() {

    const select =
      document.getElementById(
        "countdownSelect"
      );


    // Clear existing options

    select.innerHTML = "";


    countdownEvents.forEach(
      (event, index) => {

        const option =
          document.createElement(
            "option"
          );


        option.value = index;


        option.textContent =
          event.name;


        select.appendChild(
          option
        );

      }
    );


    select.addEventListener(
      "change",
      updateCountdown
    );


    updateCountdown();

  }


  function updateCountdown() {

    const select =
      document.getElementById(
        "countdownSelect"
      );


    const event =
      countdownEvents[
        Number(select.value)
      ];


    if (!event) return;


    /*
    Create the target date
    using BOTH date and time.
    */

    const targetDate =
      parseDateTime(
        event.date,
        event.time
      );


    /*
    Calculate days,
    hours and minutes.
    */

    const countdown =
      getTimeUntil(
        targetDate
      );


    const countdownNumber =
      document.getElementById(
        "countdownDays"
      );


    const countdownEvent =
      document.getElementById(
        "countdownEvent"
      );


    /*
    =========================================
    DISPLAY COUNTDOWN
    =========================================
    */

    if (countdown.total <= 0) {

      countdownNumber.textContent =
        "Today ♡";

    }

    else {

      const parts = [];


      /*
      DAYS
      */

      if (countdown.days > 0) {

        parts.push(
          `${countdown.days} ${
            countdown.days === 1
              ? "day"
              : "days"
          }`
        );

      }


      /*
      HOURS
      */

      if (countdown.hours > 0) {

        parts.push(
          `${countdown.hours} ${
            countdown.hours === 1
              ? "hour"
              : "hours"
          }`
        );

      }


      /*
      MINUTES
      */

      if (
        countdown.minutes > 0 ||
        parts.length === 0
      ) {

        parts.push(
          `${countdown.minutes} ${
            countdown.minutes === 1
              ? "minute"
              : "minutes"
          }`
        );

      }


      countdownNumber.textContent =
        parts.join(" ");

    }


    /*
    =========================================
    DISPLAY EVENT + DATE + TIME
    =========================================
    */

    countdownEvent.textContent =
      `${event.name} • ${
        targetDate.toLocaleDateString(
          undefined,
          {
            year: "numeric",
            month: "long",
            day: "numeric"
          }
        )
      } at ${
        targetDate.toLocaleTimeString(
          undefined,
          {
            hour: "numeric",
            minute: "2-digit"
          }
        )
      }`;

  }


  /*
  ============================================
  RANDOM MESSAGES
  ============================================
  */

  let lastMessageIndex = -1;


  function newMessage() {

    if (!messages.length) {

      document.getElementById(
        "message"
      ).textContent =
        "I love you. ♡";

      return;

    }


    let index;


    do {

      index =
        Math.floor(
          Math.random() *
          messages.length
        );

    } while (
      messages.length > 1 &&
      index === lastMessageIndex
    );


    lastMessageIndex = index;


    document.getElementById(
      "message"
    ).textContent =
      messages[index];

  }


  /*
  ============================================
  INITIALIZE EVERYTHING
  ============================================
  */

  updateRelationshipCounters();

  setupCountdowns();


  // IMPORTANT:
  // Show a message immediately when page loads

  newMessage();


  /*
  ============================================
  AUTO UPDATE
  ============================================
  */

  setInterval(
    function () {

      updateRelationshipCounters();

      updateCountdown();

    },
    60000
  );

  </script>

</body>
</html>
